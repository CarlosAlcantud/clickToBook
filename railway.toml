[build]
builder = "nixpacks"
buildCommand = """
    # Clean installation for backend
    cd backend && \
    rm -rf node_modules package-lock.json && \
    npm ci && \
    cd .. && \
    # Clean installation for client
    cd client && \
    rm -rf node_modules package-lock.json && \
    npm ci && \
    npm run build && \
    cd ..
"""

[deploy]
startCommand = "cd backend && npm rebuild bcrypt --build-from-source && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicy = "always"