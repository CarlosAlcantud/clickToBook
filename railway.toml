[build]
builder = "nixpacks"
buildCommand = "rm -rf node_modules/.cache && npm install && cd backend && rm -rf node_modules && npm ci && cd ../client && npm install && npm run build"

[deploy]
startCommand = "cd backend && npm rebuild bcrypt --build-from-source && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicy = "always"