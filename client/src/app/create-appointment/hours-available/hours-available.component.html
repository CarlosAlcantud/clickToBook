<div *ngIf= "hours.length > 0">
    <div  *ngFor = "let hour of hours " class = "hours" >
        <button class= "hour-button" *ngIf = "hour.available == true">{{hour.hour}}</button>
    </div>
</div>

<p class = "message" *ngIf = "hours.length <=0"> No appoiments available for the day</p>
<p class = "link" *ngIf = "hours.length <= 0"> Want to recive an email if there is an opening on this day? Click here</p>
