
<form class="form" novalidate>
    <div class="form-group">
        <label for="email" class="form-label">E-mail address</label>
        <input 
            id="email" 
            name="email" 
            type="email" 
            autocomplete="email" 
            placeholder="johndoe@example.com" 
            required 
            class="form-input"
        />
        <p class="form-error">Please provide a valid email address.</p>
    </div>

    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
            id="password" 
            name="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder=" " 
            required 
            class="form-input"
        />
        <p class="form-error">Please input your password.</p>
    </div>

    

    <div class="form-group">
        <button type="submit" class="submit-button">Sign in</button>
    </div>
</form>
