<div class="appointments-container">
    <calendar></calendar>
    
    <div *ngIf="show" class="date-container">

      <div>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'todas' }" 
            (click)="setFilter('todas')">
            Todas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'pasadas' }" 
            (click)="setFilter('pasadas')">
            Pasadas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'futuras' }" 
            (click)="setFilter('futuras')">
            Futuras
        </button>
      </div>
      
      
      <ng-container *ngIf="filteredAppointments.length > 0; else notAppointments">
        <p *ngIf="selectedFilter === ''">{{fechaCompleta}}</p>
        <div *ngFor="let workerAppointment of filteredAppointments; let i = index">
          <button class ="cita" 
          [class.expanded]=" expandedIndex === i"
          (click)="expand(i)">
          <div *ngIf="selectedFilter === ''"  class ="cita-info">
              <p>{{workerAppointment.userName}},</p>
              <p>{{workerAppointment.hour}}</p>
          </div>
          <div *ngIf="selectedFilter !== ''" class="cita-info-completa">
            
            <p >{{workerAppointment.fechaCompleta}}</p>
            <p>a las {{workerAppointment.hour}}</p>
            <p>{{workerAppointment.userName}}</p>
            
          </div>
              
            <div *ngIf="expandedIndex === i" class="extra-buttons">
              <button class="edit-button" (click)="editAppointment(workerAppointment)"> Editar</button>
              <button class="delete-button" (click)="deleteAppointment(workerAppointment)" >Eliminar</button>
            </div>
            
          </button>
        </div>

      </ng-container>  
  
      <ng-template #notAppointments>
        <p class="message">No tienes citas para el día {{fechaCompleta}}</p>
      </ng-template>
    </div>

    <!-- <router-outlet *ngIf="!show"></router-outlet> -->
    <router-outlet></router-outlet>
    
</div>
