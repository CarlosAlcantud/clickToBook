<div class="appointments-container">
    <calendar></calendar>
    
    <div *ngIf="show" class="date-container">

      <div>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'todas' }" 
            (click)="setFilter('todas')">
            Todas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'pasadas' }" 
            (click)="setFilter('pasadas')">
            Anteriores
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'futuras' }" 
            (click)="setFilter('futuras')">
            Proximas
        </button>
      </div>
      
      <div class="appointments-list">

        <ng-container *ngIf="filteredAppointments.length > 0; else notAppointments">
          <p *ngIf="selectedFilter === ''">{{fechaCompleta}}</p>
          <div *ngFor="let workerAppointment of filteredAppointments; let i = index">
            <button class ="cita" 
            [class.expanded]=" expandedIndex === i"
            (click)="expand(i, workerAppointment.rawDate)">
            <div *ngIf="selectedFilter === ''"  class ="cita-info">
                <p>{{workerAppointment.userName}},</p>
                <p>{{workerAppointment.hour}}</p>
            </div>
            <div *ngIf="selectedFilter !== ''" class="cita-info-completa">
              
              <p >{{workerAppointment.fechaCompleta}}</p>
              <p>a las {{workerAppointment.hour}}</p>
              <p>{{workerAppointment.userName}}</p>
              
            </div>
                
              <div *ngIf="expandedIndex === i" class="extra-buttons">
                <button class="delete-button" (click)="deleteAppointment(workerAppointment)" >
                <i class="fas fa-times"></i>
                Eliminar</button>
                <button class="edit-button" (click)="editAppointment(workerAppointment)">
                <i class="fas fa-edit"></i>
                 Editar</button>
                
              </div>
              
            </button>
          </div>

        </ng-container>  
    
        <ng-template #notAppointments>
          <p class="message" *ngIf="!selectedFilter">No tienes citas para el día {{fechaCompleta}}</p>
          <p class="message" *ngIf="selectedFilter === 'pasadas'">No tienes citas pasadas</p>
          <p class="message" *ngIf="selectedFilter === 'futuras'">No tienes citas futuras</p>
          <p class="message" *ngIf="selectedFilter === 'todas'">No tienes citas</p>
        </ng-template>
      </div>
    </div>

    <div class="modal" *ngIf="showConfirmDialog">
        <div class="modal-content">
            <h2>Confirmar cancelación</h2>
            <p>¿Estás seguro de que deseas cancelar esta cita?</p>
            <div class="modal-buttons">
                <button class="edit-button" (click)="confirmDelete()">Sí, cancelar</button>
                <button class="delete-button" (click)="closeConfirmDialog()">No, mantener</button>
            </div>
        </div>
    </div>

    <!-- <router-outlet *ngIf="!show"></router-outlet> -->
    <router-outlet></router-outlet>
    
</div>
