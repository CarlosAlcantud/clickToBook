<div *ngIf="nav" class="nav-container">
    <button class="navegation-button" (click)="registerClient()">
    <img src="../assets/registerStudent.png" alt="Registrar alumno" class="icono-boton" />
    Registrar nuevo alumno
    </button>

    <button class="navegation-button" (click)="bookAppointment()">
        <img src="../assets/bookClasses.png" alt="Apuntar clases" class="icono-boton" />
        Reservar Clases
    </button>

    <button class="navegation-button" (click)="buyClasses()">
        <img src="assets/payClasses.png" alt="Añadir clases" class="icono-boton" />
        Añadir clases
    </button>

</div>
<div *ngIf="!nav" [ngClass] = "{'actions-container': !buyclasses, 'classes-container': buyclasses }" >
    <h2 class="title">{{bookappointment ? 'Reservar clase' : buyclasses ? 'Añadir Clases' : 'Registrar nuevo alumno'}}</h2>

        <div class="form-group" *ngIf="bookappointment || buyclasses">
            <div class="form">
                <label for="student" class="form-label">Alumno</label>
                <select 
                    [(ngModel)]="selectedClientObj"
                    id="student" 
                    name="student" 
                    required 
                    class="form-input"
                    #studentInput="ngModel"
                    (change)="selectStudent()"
                    >
                    <option value="" disabled selected>Selecciona un alumno</option>
                    <option *ngFor="let client of clients" [ngValue]="client">{{client.username}}</option>
                </select>
                <p class="form-error" *ngIf="studentInput.invalid">Por favor selecciona un alumno.</p>
            </div>
            
            
            <button *ngIf="bookappointment" class="return" (click)="goBack()">
                <i class="fas fa-arrow-left"></i>
                volver</button>
        </div>

    <div class= "form" *ngIf= "buyclasses">
        <label for="date" class="form-label">Clases</label>
            <input 
                type="number" 
                id="number" 
                name="number" 
                required 
                [min]="1"
                class="form-input"
                [(ngModel)]="numberofclases"
                #dateInput="ngModel"
            >
            
    </div>
    <!-- <button *ngIf= "buyclasses" class="return" (click)="addClasses()">Añadir</button> -->

    <div [ngClass]="{'appointment-container': true, 'disabled-container': bookappointment && !selectedClientObj }">
        <router-outlet></router-outlet>
        
    </div>
    <!-- <div *ngIf="!selectedClientObj && bookappointment" class="selection-message">
        Selecciona un alumno primero
    </div> -->
    
    <div [ngClass]="{'button-row': buyclasses, 'button-column': !buyclasses}">
        <!-- Botón Añadir (solo visible en buyclasses) -->
        <button *ngIf="buyclasses" class="add-client-button" (click)="addClasses()">
            <i class="fas fa-plus-circle"></i>
            Añadir</button>
        
        <!-- Botón Volver (siempre visible) -->
        <button *ngIf="!bookappointment" class="return" (click)="goBack()">
            <i class="fas fa-arrow-left"></i>
            volver</button>
    </div>
</div>
