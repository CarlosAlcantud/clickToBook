<div class="edit-container">
    
    <div >
        <p class="title">{{message}}</p>
        <p>{{partMessage}}</p>
    </div>
    <div *ngIf="hourSelected === ''">
        <!-- <div class="subtitle">
            <p>Fecha actual: {{appointmentDate}} </p> 
        </div> -->
        <calendar ></calendar>
    </div>
    

    <div *ngIf="hourSelected === ''">
        <hours-available (hourselcted)="hourAdded($event) "/>
        <button class="volver" (click)="volver()">Volver</button>
    </div>
    
    <div class="cita" *ngIf="hourSelected !== ''" >
        <p><strong>Nueva fecha el:</strong> <span class="variable-text">{{fecha}}</span></p>
        <p><strong>A las:</strong> <span class="variable-text">{{hourSelected}}</span></p>
        <div class="buttons">
            <button class="cancelar"(click)="cancel()">
                <i class="fas fa-times"></i>
                Cancelar</button>
            <button class= "actualizar"(click)="updateAppointment()">
                <i class="fas fa-calendar-check"></i>
                Actualizar</button>
            
            
        </div>

    </div>
    
    
</div>
<div class="modal" *ngIf="showResponseDialog">
    <div class="modal-content">
        <h2>{{messageDialog}}</h2>
        <p></p>
        <button class="Ok-button" (click)="reRoute()">Ok</button>     
    </div>
</div>
