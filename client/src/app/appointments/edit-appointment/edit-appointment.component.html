<div class="edit-container">
    
    <div class="title">
        <p>Editando la cita de: {{message}}</p>
    </div>
    <div *ngIf="hourSelected === ''">
        <div class="subtitle">
            <p>Fecha actual: {{appointmentDate}} </p> 
        </div>
        <calendar ></calendar>
    </div>
    

    <div *ngIf="hourSelected === ''">
        <hours-available (hourselcted)="hourAdded($event) "/>
        <button class="volver" (click)="volver()">Volver</button>
    </div>
    
    <div *ngIf="hourSelected !== ''" >
        <div class="subtitle">
            <p>Nueva fecha: {{fecha}}</p>
            <p>Nueva hora: {{hourSelected}}</p>
        </div>
        
        <div class="buttons">
            <button class="cancelar"(click)="cancel()">Cancelar</button>
            <button class= "actualizar"(click)="updateAppointment()">Actualizar</button>
            
        </div>

    </div>
    
    
</div>
