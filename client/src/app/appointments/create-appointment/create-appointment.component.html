<div class = "box" *ngIf="appointment == null">
    <calendar />
    <!-- Recibe la hora seleccionada que emite el componente hours-available y se recibe en el metodo hourAdded -->
    <hours-available (hourselcted)="hourAdded($event) "/>
    
</div>
<div class = "box" *ngIf="appointment !== null && showComponent === false">
    <!-- 
    La varuable entre corchetes [appointment] es ek nombre de la variable en el destino (book-appointment) y la que va en 
    comillas "appointment" es la de origen (create-appointment)
    Lo que hace: [appointment]="appointment" es pasar el objeto appointment al componente book-appointment 
    y lo que hace: 
    [hourSelected] = "hourSelected" es pasar la hora seleccionada al componente book-appointment -->
    <book-appointment [appointment]="appointment" [hourSelected] = "hourSelected"  /> 
</div>
<div >
    <show-appointments />
</div>
