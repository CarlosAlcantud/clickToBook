<div class = "box" *ngIf="appointment == null">
    <p *ngIf="!isWorker && classesAvailable !==0">Actualmente dispones de {{classesAvailable}} clases.</p>
    
    <p *ngIf="classesAvailable === 0" class="message">Actualmente no dispones de clases disponibles, por favor contacta con tu profesor.</p>
    
    
    <div class="calendar-container" [class.disabled-calendar]="classesAvailable === 0">
        <!-- Overlay para prevenir clicks cuando está deshabilitado -->
        <div class="calendar-overlay" *ngIf="classesAvailable === 0"></div>
        <calendar />
    </div>
    <!-- Recibe la hora seleccionada que emite el componente hours-available y se recibe en el metodo hourAdded -->
    <div class="hours-container" [class.disabled-calendar]="classesAvailable === 0">
        <!-- Overlay para prevenir clicks cuando está deshabilitado -->
        <div class="calendar-overlay" *ngIf="classesAvailable === 0"></div>
        <!-- Recibe la hora seleccionada que emite el componente hours-available y se recibe en el metodo hourAdded -->
        <hours-available (hourselcted)="hourAdded($event)" />
    </div>
    
</div>
<div class = "box" *ngIf="appointment !== null">
  
    <book-appointment [appointment]="appointment" [hourSelected] = "hourSelected" (reset)="resetSelection()"></book-appointment> 
</div>
