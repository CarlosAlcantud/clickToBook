<div class = "box">
  <div class="calendar-container">
    <div class="calendar-header">
      <button class = "month-nav"(click)="prevMonth()">&#8249;</button>
      <span>{{ monthName }} {{ year }}</span>
      <button class = "month-nav"(click)="nextMonth()">&#8250;</button>
    </div>
  
    <table>
      <thead>
        <tr>
          <th *ngFor="let day of weekDays">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of weeks">
          <td *ngFor="let day of week" 
              [ngClass]="{'today': isToday(day), 'selected': isSelected(day), 'notAvailable': !day}"
              (click)="selectDay(day)">
            {{ day }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <div class = "titulo">Reserva el</div>
  <div class="frase" >{{nameOfTheDay}} {{selectedDay}} de {{monthName}}, {{year}}</div>

</div>
