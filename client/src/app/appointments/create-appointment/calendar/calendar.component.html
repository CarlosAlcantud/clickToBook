<div class = "box">
  <div class="calendar-container">
    <div class="calendar-header">
      <button class = "month-nav"(click)="prevMonth()">&#8249;</button>
      <span>{{ monthName }} {{ year }}</span>
      <button class = "month-nav"(click)="nextMonth()">&#8250;</button>
    </div>
  
    <table>
      <thead>
        <tr>
          <th *ngFor="let day of weekDays">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of weeks">
          <td *ngFor="let day of week" 
              [ngClass]="getDayClasses(day)"
              (click)="selectDay(day)">
            {{ day }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="info-container">

    <ng-container *ngIf="userisClient" >
      <div class = "titulo">Reserva el</div>
      <div class= "frase"> {{completeDate}}</div>
    </ng-container >
  </div>
  

  </div>
