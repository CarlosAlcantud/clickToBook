<div *ngIf= "hoursAvailable.length > 0">
    <div  *ngFor = "let hourAvailable of hoursAvailable" class = "hours" >
        <button class= "hour-button" (click) = "onClickHour(hourAvailable)">{{hourAvailable}}</button>
    </div>
</div>

<p class = "message" *ngIf = "hoursAvailable.length <=0"> No appoiments available for the day</p>
<p class = "link" *ngIf = "hoursAvailable.length <= 0"> Want to recive an email if there is an opening on this day? Click here</p>
