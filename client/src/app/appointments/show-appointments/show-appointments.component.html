<!-- <p>show-appointments works!</p> -->
<div class = "box" >
    <p class = "titulo" >TUS RESERVAS, {{username}}</p>
    <div>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'todas' }" 
            (click)="setFilter('todas')">
            Todas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'pasadas' }" 
            (click)="setFilter('pasadas')">
            Pasadas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'futuras' }" 
            (click)="setFilter('futuras')">
            Futuras
        </button>
    </div>
    <div *ngIf="show" class="date-container">
        <div *ngFor="let appointment of filteredAppointments; let i = index">
            <button class ="cita" 
            [class.expanded]=" expandedIndex === i"
            (click)="expand(i, appointment.rawDate)">
            <div class ="cita-info">
              <p>{{appointment.date}},</p>
              <p>{{appointment.hour}}</p>
            </div>
                
              <div *ngIf="expandedIndex === i" class="extra-buttons">
                <button class="edit-button" (click)="editAppointment(appointment)"> Editar</button>
                <button class="delete-button" (click)="deleteAppointment(appointment)" >Cancelar</button>
              </div>
              
            </button>
          </div>


    </div>
    
    <router-outlet></router-outlet>
</div>
