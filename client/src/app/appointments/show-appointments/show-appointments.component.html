<!-- <p>show-appointments works!</p> -->
<div class = "box" >
    <p class = "titulo" >TUS CLASES, {{username}}</p>
    <div class="exams-container" *ngIf="enrolledExam.length > 0">
        <h3 class="exams-title">¡¡¡¡Recuerda tu examen!!!! </h3>
        <div class="exams-grid">
            <div *ngFor="let exam of enrolledExam" class="exam-card">
                <!-- <div class="exam-icon">🚗</div> -->
                <img src="assets/exam.png" alt="" class="exam-icon">
                <div class="exam-info">
                    <p class="exam-date">{{exam}}</p>
                    <p class="exam-reminder">¡Mucha suerte!</p>
                </div>
            </div>
        </div>
    </div>
    <div class="date-container">
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'todas' }" 
            (click)="setFilter('todas')">
            Todas
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'pasadas' }" 
            (click)="setFilter('pasadas')">
            Anteriores
        </button>
        <button 
            class="button" 
            [ngClass]="{ 'active': selectedFilter === 'futuras' }" 
            (click)="setFilter('futuras')">
            Proximas
        </button>
    </div>
    <div *ngIf="show" class="appointments-list">
      <ng-container *ngIf="filteredAppointments.length > 0; else notAppointments">
        <div *ngFor="let appointment of filteredAppointments; let i = index">
            <button class ="cita" 
            [class.expanded]=" expandedIndex === i"
            (click)="expand(i, appointment.rawDate)">
            <div class ="cita-info">
              <p>{{appointment.date}},</p>
              <p>{{appointment.hour}}</p>
            </div>
                
              <div *ngIf="expandedIndex === i" class="extra-buttons">
                <button class="delete-button" (click)="deleteAppointment(appointment)" >
                <i class="fas fa-times"></i>
                Eliminar</button>
                <button class="edit-button" (click)="editAppointment(appointment)">
                <i class="fas fa-edit"></i>
                 Editar</button></div>

            </button>
        </div>
      </ng-container>
      <ng-template #notAppointments>
        <p class="message" *ngIf="selectedFilter === 'pasadas'">No tienes clases anteriores</p>
        <p class="message" *ngIf="selectedFilter === 'futuras'">No tienes proximas clases</p>
        <p class="message" *ngIf="selectedFilter === 'todas'">No tienes clases</p>
      </ng-template>

    </div>

    <div class="modal" *ngIf="showConfirmDialog">
        <div class="modal-content">
            <h2>Confirmar cancelación</h2>
            <p>¿Estás seguro de que deseas cancelar esta cita?</p>
            <div class="modal-buttons">
                <button class="edit-button" (click)="confirmDelete()">Sí, cancelar</button>
                <button class="delete-button" (click)="closeConfirmDialog()">No, mantener</button>
            </div>
        </div>
    </div>
    
    <router-outlet></router-outlet>
</div>
