<form class="form" (submit)="onLogin(loginForm)" ngForm #loginForm="ngForm">
    <div class="logo-container">
      <img src="assets/logo.png" alt="ClickToBook Logo" class="logo" /> 
    </div>
    <div class="login-title">Inicia sesión</div>
    <div class="form-group">
        <label for="identifier" class="form-label">Email o Teléfono</label>
        <input 
            ngModel
            id="identifier" 
            name="identifier" 
            type="text" 
            autocomplete="username" 
            placeholder="johndoe@example.com o +34658834983" 
            required 
            class="form-input"
            [ngClass]="{'error-input': !userExists}"
            #identifierInput="ngModel"
            (input)="clearError()"
        />
        <p class="form-error" *ngIf="formnotValid">Por favor introduce un email o teléfono válido.</p>
        <p class="form-error" *ngIf="!userExists">{{ userMessage }}</p>
    </div>

    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
            ngModel
            id="password" 
            name="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="********" 
            required 
            class="form-input"
            [ngClass]="{'error-input': wrongPassword}"
            #passwordInput="ngModel"
            (input)="clearError()"
        />
        <p class="form-error" *ngIf="formnotValid">Por favor introduce tu contraseña</p>
        <p class="form-error" *ngIf="wrongPassword">{{ userMessage }}</p>
    </div>
    
    <div class="form-group">
        <button type="submit" class="submit-button">Iniciar sesion</button>
    </div>
</form>
