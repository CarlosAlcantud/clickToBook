<form class="form" (submit) ="onLogin(loginForm)" ngForm #loginForm="ngForm" >
    <div class="form-group" >
        <label for="identifier" class="form-label">Email o Teléfono</label>
        <input 
            ngModel
            id="identifier" 
            name="identifier" 
            type="text" 
            autocomplete="username" 
            placeholder="johndoe@example.com o 658834983" 
            required 
            class="form-input"
            #identifierInput="ngModel"
        />
        <p class="form-error" *ngIf="identifierInput.invalid">Por favor introduce un email o teléfono válido.</p>
    </div>

    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
            ngModel
            id="password" 
            name="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="********" 
            required 
            class="form-input"
            #passwordInput="ngModel"
        />
        <p class="form-error" *ngIf="passwordInput.invalid">Please input your password.</p>
    </div>
    
    <div class="form-group">
        <button type="submit" class="submit-button">LogIn</button>
    </div>
</form>
<a href="/auth/register">Not an account yet? Register</a>
