<form class="form" (submit) ="onSingUp(loginForm)" ngForm #loginForm="ngForm" >
    <div class="form-group" >
        <label for="email" class="form-label">E-mail address</label>
        <input 
            ngModel
            id="email" 
            name="email" 
            type="email" 
            autocomplete="email" 
            placeholder="johndoe@example.com" 
            required 
            class="form-input"
            #emailInput="ngModel"
        />
        <p class="form-error" *ngIf="emailInput.invalid" >Please provide a valid email address.</p>
        
    </div>

    <div class="form-group" >
        <label for="username" class="form-label">Nombre</label>
        <input 
            ngModel
            id="username" 
            name="username" 
            type="text"
            placeholder="johndoe" 
            required 
            class="form-input"
        />
    </div>
    <!-- <div class="form-group" >
        <label for="phone" class="form-label">Telefono</label>
        <input 
            ngModel
            id="phone" 
            name="phone" 
            type="text"  
            class="form-input"
            placeholder="658834983"
            
        />
       
    </div> -->

    <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input 
            ngModel
            id="password" 
            name="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="********" 
            required 
            class="form-input"
            #passwordInput="ngModel"
        />
        <p class="form-error" *ngIf="passwordInput.invalid">Please input your password.</p>
    </div>

    <div class="form-group">
        <label for="worker" class="form-label">Trabajador</label>
        <select 
            ngModel
            id="worker" 
            name="worker" 
            required 
            class="form-input"
            #trabajadorInput="ngModel"
        >
            <option value="" disabled selected>Selecciona un trabajador</option>
            <option *ngFor="let worker of workers" [value]="worker.id">{{worker.username}}</option>
        </select>
        <p class="form-error" *ngIf="trabajadorInput.invalid">Por favor selecciona un trabajador.</p>
    </div>
    
    <div class="form-group">
        <button type="submit" class="submit-button">
            <i class="fas fa-user-plus"></i>
            Registrar</button>
    </div>
</form>
