<nav class="navbar">
    <div class="container">
        <div class="navbar-content"  >
            <div class="navbar-left">
                <a routerLink="/"  class="brand">
                    <div class="brand-name">ClBk</div>
                </a>
            </div>
            <ng-container *ngIf="userIsAuthenticated; else notAuthenticated">

                <ng-container *ngIf="userisClient">
                    <div class="navbar-right">
                        <div class="authenticated"  >
                            <a routerLink="/showappointments" routerLinkActive="active" class="navbar-link">Appointments</a>
                            <a routerLink="/create" routerLinkActive="active" class="navbar-link">Book</a>
                            <button class="navbar-link" (click)="onLogout()">LogOut</button>
                        </div>
                    </div>

                </ng-container>
                

                <ng-container *ngIf="userisWorker">
                    <div class="authenticated" >
                        <a routerLink="/worker/appointments" routerLinkActive="active" class="navbar-link">perfil</a>
                        <button class="navbar-link" (click)="onLogout()">LogOut</button>
                    </div>
    
                </ng-container>

                <ng-container *ngIf="userisAdmin"> >

                    <div class="authenticated" >
                        <button class="navbar-link" (click)="onLogout()">LogOut</button>
                    </div>
    
                </ng-container>

            </ng-container>

            <ng-template #notAuthenticated>
                <div class="authenticated" *ngIf="!userIsAuthenticated">
                    <a routerLink="/auth/register" routerLinkActive="active" class="navbar-link">Sign up</a>
                    <a routerLink="/auth/login" routerLinkActive="active" class="navbar-link">LogIn</a>
                </div>  

            </ng-template>

        </div>
    </div>
</nav>
