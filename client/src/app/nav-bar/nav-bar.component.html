<nav class="navbar">
    <div class="container">
        <div class="navbar-content"  >
            <div class="navbar-left">
                <a routerLink="/"  class="brand">
                    <div class="brand-name">ClBk</div>
                </a>
            </div>
            <ng-container *ngIf="userIsAuthenticated; else notAuthenticated">

                <ng-container *ngIf="userisClient">
                     <div class="hamburger" (click)="toggleMenu()">
                        <span class="material-icons">
                            {{isMobileMenuOpen ? 'close' : 'menu'}}
                        </span>
                     </div>
                    <div class="navbar-right" [class.mobile]="isMobileMenuOpen" [class.show]="isMobileMenuOpen">
                        <div class="authenticated"  >
                            <button class="navbar-link exam-available-btn" *ngIf="posibleExams.length>0" (click)="openExamsModal()">Examen disponible</button>
                            <a (click)="isMobileMenuOpen = false" routerLink="/showappointments" routerLinkActive="activated" class="navbar-link">Clases</a>
                            <a (click)="isMobileMenuOpen = false" routerLink="/create" routerLinkActive="activated" class="navbar-link">Reservar</a>
                            <button class="navbar-link" (click)="onLogout()">Cerrar Sesion</button>
                        </div>
                    </div>

                </ng-container>
                

                <ng-container *ngIf="userisWorker">
                    <div class="hamburger" (click)="toggleMenu()">
                        <span class="material-icons">
                            {{isMobileMenuOpen ? 'close' : 'menu'}}
                        </span>
                    </div>
                    <div class="navbar-right" [class.mobile]="isMobileMenuOpen" [class.show]="isMobileMenuOpen">
                        <div class="authenticated">
                            <a routerLink="/auth/register-worker"
                            [class.active]="!isGestionesActive()"
                            (click)="isMobileMenuOpen = false"
                            class="navbar-link">Registrar trabajador</a>
                            <a routerLink="/worker/schedules/create-consult"
                            [class.active]="!isGestionesActive()"
                            (click)="isMobileMenuOpen = false"
                            class="navbar-link">Horario</a>
                            <a routerLink="/worker/exams"
                            [class.active]="!isGestionesActive()"
                            (click)="isMobileMenuOpen = false"
                            class="navbar-link">Examenes</a>
                            <a routerLink="/worker"
                            [class.active]="isGestionesActive()"
                            (click)="isMobileMenuOpen = false"
                            class="navbar-link">Gestiones</a>
                            <button class="navbar-link" (click)="onLogout()">Cerrar Sesion</button>
                        </div>
                    </div>
                </ng-container>

                <ng-container *ngIf="userisAdmin"> >

                    <div class="authenticated" >
                        <button class="navbar-link" (click)="onLogout()">LogOut</button>
                    </div>
    
                </ng-container>

            </ng-container>

            <ng-template #notAuthenticated>
                <div class="authenticated" *ngIf="!userIsAuthenticated">
                    <!-- <a routerLink="/auth/register" routerLinkActive="active" class="navbar-link">Sign up</a> -->
                    <a routerLink="/auth/login" routerLinkActive="active" class="navbar-link">LogIn</a>
                </div>  

            </ng-template>

        </div>
    </div>
    <div class="modal" *ngIf="showModal">
        <div class="modal-content">
            <span class="close" (click)="closeModal()">&times;</span>
            <h2>Tienes exámenes Disponibles</h2>
            <div class="exam-list">
                <div *ngFor="let exam of posibleExams; let i = index" class="exam-item" >
                    <button class ="cita" 
                        [class.expanded]=" expandedIndex === i"
                        (click)="expand(i)">
                        <div class ="cita-info">
                            <p>{{exam.date}}</p>
                        </div>
                            
                        <div *ngIf="expandedIndex === i" class="extra-buttons">
                            <button class="edit-button" (click)="enrollToExam(exam.id)">Apuntarme </button>
                        </div>

                        </button>
                </div>
            </div>
        </div>
    </div>
<div class="modal-message" *ngIf="showResponseDialog">
        <div class="modal-message-content">
            <p *ngIf="news" class="newstitle">¡¡¡¡Importante!!!</p>
            <p *ngIf="news" class="newscontent">{{messageDialog}}</p>
            <p *ngIf="!news" class="message-dialog">{{messageDialog}}</p>

            <p></p>
            <div class="modal-buttons">
                <button class="Ok-button" (click)="ok()">Ok</button>
            </div>
        </div>
    </div>

</nav>
